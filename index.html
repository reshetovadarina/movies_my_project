<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="theme-button">Змінити тему</button>

    <h1>Мої улюблені фільми</h1>
    <p id="counter"></p>

    <div id="app">
      <form id="movie-form">
        <input type="text" id="movie-input" placeholder="Назва" />
        <div id="title-error"></div>

        <input type="number" id="movie-year" placeholder="Рік" value="2026" />
        <div id="year-error"></div>

        <select id="movie-genre">
          <option>Бойовик</option>
          <option>Комедія</option>
          <option>Драма</option>
          <option>Фантастика</option>
        </select>
        <label><input type="checkbox" id="movie-watched" /> Переглянуто</label>
        <button type="submit">Додати</button>
      </form>

      <input
        type="text"
        id="search-input"
        placeholder="Швидкий пошук фільму..."
      />
      <button id="clear-button">Очистити список</button>

      <ul id="movie-list"></ul>
      <div id="search-result"></div>
      <div id="toast"></div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
